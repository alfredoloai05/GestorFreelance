name: Wire personal assistant

on:
  push:
    paths:
      - 'scripts/patch-personal-assistant.mjs'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch app and data service
        run: node scripts/patch-personal-assistant.mjs
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/services/dataService.js
          git commit -m "feat: add real search and sync status"
          git push
